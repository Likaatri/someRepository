name: Build HDT-Reconnector

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore HDT-Reconnector.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild HDT-Reconnector.sln /p:Configuration=Release /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDT-Reconnector-build
          path: |
            HDT-Reconnector/bin/x86/Release/HDT-Reconnector.dll
            HDT-Reconnector/bin/x86/Release/**/*.dll
            HDT-Reconnector/bin/x86/Release/**/*.xml
